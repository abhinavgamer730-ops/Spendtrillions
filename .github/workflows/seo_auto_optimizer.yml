name: Automated SEO Optimization & Sitemap Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automated SEO Optimizer
        run: node scripts/auto_seo_optimizer.js

      - name: Commit and Push Updated Sitemap & Robots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes in sitemap.xml or robots.txt."
          else
            git commit -m "chore(seo): auto-update sitemap.xml & robots.txt [skip ci]"
            git push origin main
          fi
